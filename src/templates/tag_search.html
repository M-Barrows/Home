{% extends 'base.html' %}

{% block content %}

{% for page in pages | sort(attribute='date', reverse=true) | selectattr("hidden", "ne", true) %}
{% if tag in page.meta.tags%}

<div class="columns">
    <div class="column my-3">
        <div class="card">
            <div class="card-content">
                <a href="{{url_for('page',path=page.path)}}">
                    <p class="title">{{page.meta.title}}</p>
                </a>
                <p class="subtitle">{{page.meta.date}}</p>
                <p class="content">{{page.meta.excerpt}}</p>
            </div>
            <footer class="card-footer">
                <button class="card-footer-item button is-full is-ghost">
                    <span>
                        <a href="{{url_for('page',path=page.path)}}">
                            Read
                        </a>
                    </span>
                </button>
                <button class="card-footer-item button is-full is-ghost">
                    <span> Discuss on <a href="https://hachyderm.io/deck/@CodeAndCoffee">Mastodon</a> </span>
                </button>
            </footer>
        </div>
    </div>
</div>

{% endif %}

{% endfor %}
{% endblock %}
