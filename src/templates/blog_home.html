{% extends "base.html" %}

{% block content %}
    {% for page in pages | sort(attribute='date', reverse=true) | selectattr("hidden", "ne", true) %}
    <div class="columns">
        <div class="column my-3">
            <div class="card">
            <div class="card-content">
                <a href="{{url_for('page',path=page.path)}}"><p class="title">{{page.meta.title}}</p></a>
                <p class="subtitle">{{page.meta.date}}</p>
                <p class="content">{{page.meta.excerpt}}</p>
            </div>
            <footer class="card-footer">
                        <a class="button is-link is-full card-footer-item is-ghost" href="{{url_for('page',path=page.path)}}">
                            Read
                        </a>
                    <a class="button is-link is-full card-footer-item is-ghost" href="https://hachyderm.io/deck/@CodeAndCoffee">Discuss on Mastodon</a>
            </footer></div>
        </div>
    </div>
{% endfor %}


{% endblock %}
