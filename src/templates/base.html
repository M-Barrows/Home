<!doctype html>
<html data-theme="dark">

<head>
    <title>{{ pages.get('index').meta.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='css/main.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='highlight/styles/night-owl.min.css')}}">
    <script src="{{ url_for('static', filename='highlight/highlight.min.js')}}"></script>
    <script>hljs.highlightAll();</script>
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ url_for('static',filename='favicon.ico') }}" />
    <link rel="shortcut icon" href="{{ url_for('static',filename='favicon.ico') }}" />
    <script src="https://kit.fontawesome.com/8c781f34f9.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="sticky top-0 z-50">
        {% include 'navbar_mobile.html'%}
    </div>
    <div class="content mx-auto mt-5 mb-20">
        {% block content%}
        {% endblock %}
    </div>

    <footer class="w-screen mt-auto md:fixed md:bottom-0">
        {% include 'footer.html'%}
    </footer>
    <script src="{{ url_for('static', filename='libs.js') }}"></script>
</body>

</html>
