name: Docker Image CI

on: 
  - push
  - workflow_dispatch 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: registry.codecoffee.org
          username: admin 
          password: admin
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: repository.codecoffee.org/home:$(date +%s)