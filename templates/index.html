{% extends "base.html" %}
    {% block content %}
    <div>
        {{ pages.get('index').html|safe }}
    </div>
    <ul>
        {% for page in pages %}
            <li><a href="{{ url_for('page', path=page.path) }}">{{ page.meta.title }}</a></li>
        {% endfor %}
    </ul>
    {% endblock %}
