{% extends "base.html" %}

{% block content %}
    {% for page in pages | sort(attribute='date', reverse=true) | selectattr("hidden", "ne", true) %}
    <div class="columns">
        <div class="column my-3">
            <div class="card"></div>
            <div class="card-content">
                <a href="{{url_for('page',path=page.path)}}"><p class="title">{{page.meta.title}}</p></a>
                <p class="subtitle">{{page.meta.date}}</p>
                <p class="content">{{page.meta.excerpt}}</p>
            </div>
            <footer class="card-footer">
                <p class="card-footer-item">
                    <span>
                        <a href="{{url_for('page',path=page.path)}}">
                            Read
                        </a>
                    </span>
                </p>
                <p class="card-footer-item">
                    <span> Discuss on <a href="https://hachyderm.io/deck/@CodeAndCoffee">Mastodon</a> </span>
                </p>
            </footer>
        </div>
    </div>
{% endfor %}


{% endblock %}
